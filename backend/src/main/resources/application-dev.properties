# ==============================================================================
# HostFlow - Configuración del Entorno de DESARROLLO (PostgreSQL)
# ==============================================================================
# Este archivo sobrescribe las propiedades base (application.properties)
# exclusivamente cuando la aplicación se ejecuta con el perfil activo 'dev'.
#
# Objetivo: Proporcionar un entorno de desarrollo que sea un espejo exacto
# de producción, utilizando PostgreSQL local para garantizar compatibilidad
# total de tipos de datos, funciones SQL y comportamiento del ORM.
# ==============================================================================

# ==============================================================================
# 1. CONFIGURACIÓN DE BASE DE DATOS (PostgreSQL Local)
# ==============================================================================
# Conexión a la base de datos PostgreSQL local de desarrollo.
# Formato: jdbc:postgresql://<host>:<puerto>/<nombre_base_de_datos>
spring.datasource.url=jdbc:postgresql://localhost:5432/hostflow_dev

# Driver oficial de PostgreSQL.
spring.datasource.driver-class-name=org.postgresql.Driver

# Credenciales de acceso. Se usan variables de entorno con un fallback
# seguro ('postgres') para facilitar el trabajo en equipo sin exponer claves.
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}

# ==============================================================================
# 2. CONFIGURACIÓN JPA / HIBERNATE
# ==============================================================================
# 'update': Permite que Hibernate cree o actualice el esquema de la base de datos
# automáticamente al iniciar, basándose en las anotaciones de las entidades (@Entity).
# Esto es ideal en desarrollo para iterar rápido sin escribir scripts SQL manuales.
# (⚠️ Nota crítica: En producción, esto debe ser estrictamente 'validate').
spring.jpa.hibernate.ddl-auto=update

# Muestra las consultas SQL generadas por Hibernate en la consola.
# Fundamental para depurar (debug) el rendimiento y la lógica de las queries.
spring.jpa.show-sql=true

# Formatea el SQL mostrado en la consola con indentación y saltos de línea
# para que sea legible por humanos y fácil de copiar a un cliente SQL (ej. DBeaver).
spring.jpa.properties.hibernate.format_sql=true

# Especifica el dialecto de PostgreSQL. Aunque Spring Boot 3 suele detectarlo
# automáticamente, declararlo explícitamente evita advertencias y asegura
# que Hibernate use las optimizaciones específicas de PostgreSQL.
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# Deshabilita "Open Session in View". Mejora el rendimiento y evita que las
# conexiones a la base de datos se mantengan abiertas innecesariamente durante
# la renderización de la vista, previniendo advertencias y posibles fugas de memoria.
spring.jpa.open-in-view=false

# ==============================================================================
# 3. CONFIGURACIÓN DE FLYWAY (Migraciones de Base de Datos)
# ==============================================================================
# ⚠️ DESACTIVADO EN DESARROLLO.
# En Spring Boot 3, tener Flyway habilitado junto con 'ddl-auto=update' causa
# conflictos de orden de ejecución, haciendo que Hibernate omita la creación
# de tablas. Para desarrollo ágil, dejamos que Hibernate gestione el esquema.
# (Flyway se activará exclusivamente en el perfil 'prod' para control estricto).
spring.flyway.enabled=false

# ==============================================================================
# 4. CONFIGURACIÓN DE CORREO ELECTRÓNICO (Mailtrap Sandbox)
# ==============================================================================
# Utilizamos Mailtrap como servidor SMTP de prueba. Captura todos los correos
# enviados por la aplicación y los muestra en un panel web, evitando que
# lleguen correos reales a los usuarios durante las pruebas de desarrollo.
spring.mail.host=sandbox.smtp.mailtrap.io
spring.mail.port=2525

# Las credenciales deben obtenerse del dashboard de Mailtrap (Inbox > SMTP Settings).
# Se usa la sintaxis ${VAR:default} para permitir el uso de variables de entorno
# en CI/CD o archivos .env, con un fallback seguro para desarrollo local.
spring.mail.username=${MAIL_USERNAME:tu_mailtrap_username}
spring.mail.password=${MAIL_PASSWORD:tu_mailtrap_password}

# Configuración de seguridad para la conexión SMTP (TLS)
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true

# ==============================================================================
# 5. CONFIGURACIÓN DE LOGGING (Nivel Detallado)
# ==============================================================================
# Establece el nivel de registro en DEBUG para obtener información granular
# sobre el flujo de la aplicación, facilitando la detección temprana de errores.
logging.level.com.hostflow=DEBUG
logging.level.org.springframework.security=DEBUG
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.flywaydb=INFO
logging.level.org.springframework.mail=DEBUG

# ==============================================================================
# 6. CONFIGURACIÓN DE DOCUMENTACIÓN API (SWAGGER / OPENAPI)
# ==============================================================================
# Habilita la generación de la documentación interactiva de la API en desarrollo
# para que el equipo de Frontend pueda probar los endpoints y contratos fácilmente.
springdoc.api-docs.enabled=true
springdoc.swagger-ui.enabled=true

