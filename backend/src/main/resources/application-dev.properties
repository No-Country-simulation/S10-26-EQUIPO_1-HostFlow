# ==============================================================================
# HostFlow - Configuración del Entorno de DESARROLLO (PostgreSQL)
# ==============================================================================
# Este archivo sobrescribe las propiedades base (application.properties)
# exclusivamente cuando la aplicación se ejecuta con el perfil activo 'dev'.
#
# Objetivo: Proporcionar un entorno de desarrollo que sea un espejo exacto
# de producción, utilizando PostgreSQL local y Flyway para garantizar
# compatibilidad total de tipos de datos, funciones SQL y comportamiento del ORM.
# ==============================================================================

# Importa variables de entorno locales de forma segura (no versionado en Git)
spring.config.import=optional:file:./.env[.properties]

# ==============================================================================
# 1. CONFIGURACIÓN DE BASE DE DATOS (PostgreSQL Local)
# ==============================================================================
# Conexión a la base de datos PostgreSQL local de desarrollo.
# Formato: jdbc:postgresql://<host>:<puerto>/<nombre_base_de_datos>
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/hostflow_dev}

# Driver oficial de PostgreSQL.
spring.datasource.driver-class-name=org.postgresql.Driver

# Credenciales de acceso. Se usan variables de entorno con un fallback
# seguro ('postgres') para facilitar el trabajo en equipo sin exponer claves.
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}

# ==============================================================================
# 2. CONFIGURACIÓN JPA / HIBERNATE
# ==============================================================================
# 'validate': Hibernate solo verifica que el esquema de la base de datos
# coincida con las entidades @Entity. La creación real de tablas la hace Flyway.
# Esto evita conflictos de ejecución y garantiza que el entorno local sea un
# espejo exacto de producción. (⚠️ En producción también debe ser 'validate').
spring.jpa.hibernate.ddl-auto=validate

# Muestra las consultas SQL generadas por Hibernate en la consola.
# Fundamental para depurar (debug) el rendimiento y la lógica de las queries.
spring.jpa.show-sql=true

# Formatea el SQL mostrado en la consola con indentación y saltos de línea
# para que sea legible por humanos y fácil de copiar a un cliente SQL (ej. DBeaver).
spring.jpa.properties.hibernate.format_sql=true

# Especifica el dialecto de PostgreSQL. Aunque Spring Boot 3 suele detectarlo
# automáticamente, declararlo explícitamente evita advertencias y asegura
# que Hibernate use las optimizaciones específicas de PostgreSQL.
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# Deshabilita "Open Session in View". Mejora el rendimiento y evita que las
# conexiones a la base de datos se mantengan abiertas innecesariamente durante
# la renderización de la vista, previniendo advertencias y posibles fugas de memoria.
spring.jpa.open-in-view=false

# ==============================================================================
# 3. CONFIGURACIÓN DE FLYWAY (Migraciones de Base de Datos)
# ==============================================================================
# DESACTIVADO EN DESARROLLO.
# Para desarrollo ágil, dejamos que Hibernate (ddl-auto=update) gestione el esquema.
# Flyway se activará exclusivamente en el perfil 'prod' para control estricto.
spring.flyway.enabled=false

# ==============================================================================
# 4. CONFIGURACIÓN DE CORREO ELECTRÓNICO (Gmail SMTP - Correos Reales)
# ==============================================================================
# Configuración SMTP para envío de CORREOS REALES durante el desarrollo.
#
# PROPÓSITO: Permite que todos los miembros del equipo reciban correos
# reales en sus bandejas de entrada al registrarse, incluyendo:
# • Enlaces de verificación de cuenta
# • Códigos de recuperación de contraseña
# • Confirmaciones de cambios
#
# ⚙️ CONFIGURACIÓN REQUERIDA:
# 1. Crear una cuenta de Gmail para notificaciones (recomendado no usar personal).
# 2. Activar verificación en 2 pasos en esa cuenta de Google.
# 3. Generar "App Password" (Contraseña de Aplicación) desde:
#    https://myaccount.google.com/apppasswords
# 4. Configurar las variables de entorno en IntelliJ o en el archivo .env:
#    MAIL_USERNAME=tu_cuenta@gmail.com
#    MAIL_PASSWORD=abcdefghijklmnop (16 caracteres sin espacios)
#
# 🔒 SEGURIDAD: NUNCA commitees contraseñas reales en el repositorio.
# ==============================================================================

# Servidor SMTP de Gmail
spring.mail.host=smtp.gmail.com

# Puerto 587 para TLS (recomendado) o 465 para SSL
spring.mail.port=587

# Cuenta de Gmail que enviará los correos
spring.mail.username=${MAIL_USERNAME:hostflow.notificaciones@gmail.com}

# App Password de 16 caracteres (NO uses tu contraseña normal de Gmail)
spring.mail.password=${MAIL_PASSWORD:tu_app_password_de_16_caracteres}

# Configuración de seguridad para la conexión SMTP (TLS)
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true

# Timeouts para evitar bloqueos en la conexión
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000

# ==============================================================================
# 5. CONFIGURACIÓN DE LOGGING (Nivel Detallado)
# ==============================================================================
# Establece el nivel de registro en DEBUG para obtener información granular
# sobre el flujo de la aplicación, facilitando la detección temprana de errores.
#
# Niveles disponibles: TRACE < DEBUG < INFO < WARN < ERROR
# - DEBUG: Muestra detalles del flujo de la aplicación (recomendado en desarrollo)
# - INFO: Muestra información general (recomendado en producción)
# ==============================================================================
logging.level.com.hostflow=DEBUG
logging.level.org.springframework.security=DEBUG
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.flywaydb=INFO
logging.level.org.springframework.mail=DEBUG

# ==============================================================================
# 6. CONFIGURACIÓN DE DOCUMENTACIÓN API (SWAGGER / OPENAPI)
# ==============================================================================
# Habilita la generación de la documentación interactiva de la API en desarrollo
# para que el equipo de Frontend pueda probar los endpoints y contratos fácilmente.
#
# URLs de acceso:
# - Swagger UI: http://localhost:8080/api/v1/swagger-ui.html
# - OpenAPI JSON: http://localhost:8080/api/v1/api-docs
# ==============================================================================
springdoc.api-docs.enabled=true
springdoc.swagger-ui.enabled=true

# ==============================================================================
# 7. CONFIGURACIÓN DE REGLAS DE NEGOCIO (HostFlow)
# ==============================================================================
# Tiempo de validez del código de recuperación de contraseña en minutos.
app.password-reset.expiration-minutes=60

# Longitud del código numérico aleatorio generado para la recuperación.
app.password-reset.code-length=6

# Tiempo de validez del enlace de verificación de correo en minutos.
app.email-verification.expiration-minutes=60

# URL base del frontend para redirección después de la verificación.
app.email-verification.frontend-url=http://localhost:3000/verify-email

# URL base del backend para verificación directa desde el email.
app.email-verification.backend-url=http://localhost:8080/api/v1/auth/verify-email

# ==============================================================================
# 8. CONFIGURACIÓN DE SEGURIDAD - BLOQUEO DE CUENTA
# ==============================================================================
# Número máximo de intentos fallidos de login antes de bloquear la cuenta.
# Previene ataques de fuerza bruta contra las credenciales de los usuarios.
app.security.max-failed-attempts=5

# Tiempo de bloqueo de la cuenta en minutos (después de alcanzar el máximo
# de intentos fallidos). El usuario debe esperar este tiempo o recuperar
# su contraseña para desbloquear la cuenta.
app.security.block-duration-minutes=60

# Período de tiempo en minutos para contar los intentos fallidos.
# Los intentos fallidos más antiguos que este período no se cuentan.
app.security.failed-attempts-window-minutes=60

# ==============================================================================
# 9. CONFIGURACIÓN DE CLOUDINARY
# ==============================================================================
# Credenciales para la subida de imágenes a la nube.
# Se leen desde variables de entorno para no exponer secretos en el repositorio.
cloudinary.cloud-name=${CLOUDINARY_CLOUD_NAME:}
cloudinary.api-key=${CLOUDINARY_API_KEY:}
cloudinary.api-secret=${CLOUDINARY_API_SECRET:}
cloudinary.folder=${CLOUDINARY_FOLDER:hostflow}

# ==============================================================================
# 10. CONFIGURACIÓN DE TAREAS PROGRAMADAS (Scheduling)
# ==============================================================================
# Habilita el pool de tareas programadas para el refresco automático
# de tasas de cambio desde APIs externas (DolarAPI, open.er-api, etc.).
# Se ejecuta cada 1 hora automáticamente gracias a @EnableScheduling.
spring.task.scheduling.pool.size=2