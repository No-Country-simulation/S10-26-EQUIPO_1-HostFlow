# ==============================================================================
# HostFlow - Configuraci\u00F3n del Entorno de DESARROLLO (PostgreSQL)
# ==============================================================================
# Este archivo sobrescribe las propiedades base (application.properties)
# exclusivamente cuando la aplicaci\u00F3n se ejecuta con el perfil activo 'dev'.
#
# Objetivo: Proporcionar un entorno de desarrollo que sea un espejo exacto
# de producci\u00F3n, utilizando PostgreSQL local para garantizar compatibilidad
# total de tipos de datos, funciones SQL y comportamiento del ORM.
# ==============================================================================
spring.config.import=optional:file:./.env[.properties]
# ==============================================================================
# 1. CONFIGURACI\u00D3N DE BASE DE DATOS (PostgreSQL Local)
# ==============================================================================
# Conexi\u00F3n a la base de datos PostgreSQL local de desarrollo.
# Formato: jdbc:postgresql://<host>:<puerto>/<nombre_base_de_datos>
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/hostflow_dev}

# Driver oficial de PostgreSQL.
spring.datasource.driver-class-name=org.postgresql.Driver

# Credenciales de acceso. Se usan variables de entorno con un fallback
# seguro ('postgres') para facilitar el trabajo en equipo sin exponer claves.
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}

# ==============================================================================
# 2. CONFIGURACI\u00D3N JPA / HIBERNATE
# ==============================================================================
# 'update': Permite que Hibernate cree o actualice el esquema de la base de datos
# autom\u00E1ticamente al iniciar, bas\u00E1ndose en las anotaciones de las entidades (@Entity).
# Esto es ideal en desarrollo para iterar r\u00E1pido sin escribir scripts SQL manuales.
# (\u26A0\uFE0F Nota cr\u00EDtica: En producci\u00F3n, esto debe ser estrictamente 'validate').
spring.jpa.hibernate.ddl-auto=update

# Muestra las consultas SQL generadas por Hibernate en la consola.
# Fundamental para depurar (debug) el rendimiento y la l\u00F3gica de las queries.
spring.jpa.show-sql=true

# Formatea el SQL mostrado en la consola con indentaci\u00F3n y saltos de l\u00EDnea
# para que sea legible por humanos y f\u00E1cil de copiar a un cliente SQL (ej. DBeaver).
spring.jpa.properties.hibernate.format_sql=true

# Especifica el dialecto de PostgreSQL. Aunque Spring Boot 3 suele detectarlo
# autom\u00E1ticamente, declararlo expl\u00EDcitamente evita advertencias y asegura
# que Hibernate use las optimizaciones espec\u00EDficas de PostgreSQL.
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# Deshabilita "Open Session in View". Mejora el rendimiento y evita que las
# conexiones a la base de datos se mantengan abiertas innecesariamente durante
# la renderizaci\u00F3n de la vista, previniendo advertencias y posibles fugas de memoria.
spring.jpa.open-in-view=false

# ==============================================================================
# 3. CONFIGURACI\u00D3N DE FLYWAY (Migraciones de Base de Datos)
# ==============================================================================
# \uFE0F DESACTIVADO EN DESARROLLO.
# En Spring Boot 3, tener Flyway habilitado junto con 'ddl-auto=update' causa
# conflictos de orden de ejecuci\u00F3n, haciendo que Hibernate omita la creaci\u00F3n
# de tablas. Para desarrollo \u00E1gil, dejamos que Hibernate gestione el esquema.
# (Flyway se activar\u00E1 exclusivamente en el perfil 'prod' para control estricto).
spring.flyway.enabled=false

# ==============================================================================
# 4. CONFIGURACI\u00D3N DE CORREO ELECTR\u00D3NICO (Gmail SMTP - Correos Reales)
# ==============================================================================
# Configuraci\u00F3n SMTP para env\u00EDo de CORREOS REALES durante el desarrollo.
#
#  PROP\u00D3SITO: Permite que todos los miembros del equipo reciban correos
# reales en sus bandejas de entrada al registrarse, incluyendo:
# \u2022 Enlaces de verificaci\u00F3n de cuenta
# \u2022 C\u00F3digos de recuperaci\u00F3n de contrase\u00F1a
# \u2022 Confirmaciones de cambios
#
# \u2699\uFE0F CONFIGURACI\u00D3N REQUERIDA:
# 1. Crear una cuenta de Gmail para notificaciones (recomendado no usar personal)
# 2. Activar verificaci\u00F3n en 2 pasos en esa cuenta de Google
# 3. Generar "App Password" (Contrase\u00F1a de Aplicaci\u00F3n) desde:
#    https://myaccount.google.com/apppasswords
# 4. Configurar las variables de entorno en IntelliJ:
#    MAIL_USERNAME=hostflow.notificaciones@gmail.com
#    MAIL_PASSWORD=abcdefghijklmnop (16 caracteres sin espacios)
#
# \uD83D\uDD12 SEGURIDAD: NUNCA commitees contrase\u00F1as reales en el repositorio.
# Usa siempre variables de entorno o un archivo .env local.
# ==============================================================================

# Servidor SMTP de Gmail
spring.mail.host=smtp.gmail.com

# Puerto 587 para TLS (recomendado) o 465 para SSL
spring.mail.port=587

# Cuenta de Gmail que enviar\u00E1 los correos
# Reemplaza con tu cuenta real o usa variable de entorno
spring.mail.username=${MAIL_USERNAME:hostflow.notificaciones@gmail.com}

# App Password de 16 caracteres (NO uses tu contrase\u00F1a normal de Gmail)
# Generar en: https://myaccount.google.com/apppasswords
spring.mail.password=${MAIL_PASSWORD:tu_app_password_de_16_caracteres}

# Configuraci\u00F3n de seguridad para la conexi\u00F3n SMTP (TLS)
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true

# Timeouts para evitar bloqueos en la conexi\u00F3n
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000

# ==============================================================================
# 5. CONFIGURACI\u00D3N DE LOGGING (Nivel Detallado)
# ==============================================================================
# Establece el nivel de registro en DEBUG para obtener informaci\u00F3n granular
# sobre el flujo de la aplicaci\u00F3n, facilitando la detecci\u00F3n temprana de errores.
#
# Niveles disponibles: TRACE < DEBUG < INFO < WARN < ERROR
# - DEBUG: Muestra detalles del flujo de la aplicaci\u00F3n (recomendado en desarrollo)
# - INFO: Muestra informaci\u00F3n general (recomendado en producci\u00F3n)
# ==============================================================================
logging.level.com.hostflow=DEBUG
logging.level.org.springframework.security=DEBUG
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.flywaydb=INFO
logging.level.org.springframework.mail=DEBUG

# ==============================================================================
# 6. CONFIGURACI\u00D3N DE DOCUMENTACI\u00D3N API (SWAGGER / OPENAPI)
# ==============================================================================
# Habilita la generaci\u00F3n de la documentaci\u00F3n interactiva de la API en desarrollo
# para que el equipo de Frontend pueda probar los endpoints y contratos f\u00E1cilmente.
#
# URLs de acceso:
# - Swagger UI: http://localhost:8080/api/v1/swagger-ui.html
# - OpenAPI JSON: http://localhost:8080/api/v1/api-docs
# ==============================================================================
springdoc.api-docs.enabled=true
springdoc.swagger-ui.enabled=true

# ==============================================================================
# 7. CONFIGURACI\u00D3N DE REGLAS DE NEGOCIO (HostFlow)
# ==============================================================================
# Tiempo de validez del c\u00F3digo de recuperaci\u00F3n de contrase\u00F1a en minutos.
# Los usuarios deben usar el c\u00F3digo antes de que expire.
app.password-reset.expiration-minutes=60

# Longitud del c\u00F3digo num\u00E9rico aleatorio generado para la recuperaci\u00F3n.
# 6 d\u00EDgitos es un buen balance entre seguridad y usabilidad.
app.password-reset.code-length=6

# Tiempo de validez del enlace de verificaci\u00F3n de correo en minutos.
# Despu\u00E9s de este tiempo, el usuario debe solicitar un nuevo enlace.
app.email-verification.expiration-minutes=60

# URL base del frontend para redirecci\u00F3n despu\u00E9s de la verificaci\u00F3n.
# El token se appenda como query parameter: ?token=xxx
app.email-verification.frontend-url=http://localhost:3000/verify-email

# URL base del backend para verificaci\u00F3n directa desde el email.
app.email-verification.backend-url=http://localhost:8080/api/v1/auth/verify-email

# ==============================================================================
# 8. CONFIGURACI\u00D3N DE SEGURIDAD - BLOQUEO DE CUENTA
# ==============================================================================
# N\u00FAmero m\u00E1ximo de intentos fallidos de login antes de bloquear la cuenta.
# Previene ataques de fuerza bruta contra las credenciales de los usuarios.
app.security.max-failed-attempts=5

# Tiempo de bloqueo de la cuenta en minutos (despu\u00E9s de alcanzar el m\u00E1ximo
# de intentos fallidos). El usuario debe esperar este tiempo o recuperar
# su contrase\u00F1a para desbloquear la cuenta.
app.security.block-duration-minutes=60

# Per\u00EDodo de tiempo en minutos para contar los intentos fallidos.
# Los intentos fallidos m\u00E1s antiguos que este per\u00EDodo no se cuentan.
# Esto permite que el contador se "reinicie" despu\u00E9s de un tiempo.
app.security.failed-attempts-window-minutes=60
# ==============================================================================
# 8. CONFIGURACI\u00D3N DE CLOUDINARY
# ==============================================================================
cloudinary.cloud-name=${CLOUDINARY_CLOUD_NAME:}
cloudinary.api-key=${CLOUDINARY_API_KEY:}
cloudinary.api-secret=${CLOUDINARY_API_SECRET:}
cloudinary.folder=${CLOUDINARY_FOLDER:hostflow}
# ==============================================================================
# 9. CONFIGURACIÓN DE TAREAS PROGRAMADAS (Scheduling)
# ==============================================================================
# Habilita el pool de tareas programadas para el refresco automático
# de tasas de cambio desde APIs externas (DolarAPI, Frankfurter, etc.).
# Se ejecuta cada 1 hora automáticamente gracias a @EnableScheduling.
spring.task.scheduling.pool.size=2
