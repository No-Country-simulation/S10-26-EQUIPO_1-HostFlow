# ==============================================================================
# HostFlow - Perfil DESARROLLO (dev)
# ==============================================================================
# Sobrescribe application.properties cuando SPRING_PROFILES_ACTIVE=dev
# (o spring.profiles.active=dev).
#
# Objetivo: desarrollo local ágil con PostgreSQL, Hibernate update,
# SQL visible, Swagger y logs DEBUG. Flyway permanece desactivado.
# ==============================================================================

# Variables locales (ruta relativa al working directory del proceso)
spring.config.import=optional:file:./.env[.properties]

# ==============================================================================
# 1. BASE DE DATOS
# ==============================================================================
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/hostflow_dev}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}

# ==============================================================================
# 2. JPA / HIBERNATE
# ==============================================================================
# Desarrollo ágil: Hibernate actualiza el esquema. Flyway off en este perfil.
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.open-in-view=false

# ==============================================================================
# 3. FLYWAY (desactivado en dev)
# ==============================================================================
spring.flyway.enabled=false
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=5

# ==============================================================================
# 4. CORREO (Gmail SMTP + Brevo opcional)
# ==============================================================================
# Si BREVO_API_KEY está definida, EmailService prioriza Brevo.
# Si no, usa Gmail con App Password (MAIL_USERNAME / MAIL_PASSWORD).
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000

# ==============================================================================
# 5. LOGGING (detallado)
# ==============================================================================
logging.level.com.hostflow=DEBUG
logging.level.org.springframework.security=DEBUG
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.flywaydb=INFO
logging.level.org.springframework.mail=DEBUG

# ==============================================================================
# 6. SWAGGER
# ==============================================================================
springdoc.api-docs.enabled=true
springdoc.swagger-ui.enabled=true

# ==============================================================================
# 7. REGLAS DE NEGOCIO (overrides locales)
# ==============================================================================
app.password-reset.expiration-minutes=60
app.password-reset.code-length=6

app.email-verification.expiration-minutes=60
app.email-verification.frontend-url=${APP_EMAIL_VERIFICATION_FRONTEND_URL:http://localhost:3000/verify-email}
app.email-verification.backend-url=${APP_EMAIL_VERIFICATION_BACKEND_URL:http://localhost:8080/api/v1/auth/verify-email}

app.security.max-failed-attempts=5
app.security.block-duration-minutes=60
app.security.failed-attempts-window-minutes=60

# ==============================================================================
# 8. CLOUDINARY
# ==============================================================================
cloudinary.cloud-name=${CLOUDINARY_CLOUD_NAME:}
cloudinary.api-key=${CLOUDINARY_API_KEY:}
cloudinary.api-secret=${CLOUDINARY_API_SECRET:}
cloudinary.folder=${CLOUDINARY_FOLDER:hostflow}

# ==============================================================================
# 9. SCHEDULING (tasas de cambio, etc.)
# ==============================================================================
spring.task.scheduling.pool.size=2
