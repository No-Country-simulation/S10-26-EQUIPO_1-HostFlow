# ==============================================================================
# HostFlow - Configuración Base de la Aplicación (Global)
# ==============================================================================
# Este archivo contiene la configuración común y por defecto que se aplica a
# TODOS los entornos (desarrollo, pruebas, producción).
#
# PRINCIPIO DE DISEÑO: Las configuraciones específicas de infraestructura
# (base de datos, JPA/Hibernate, Flyway, correo electrónico) deben residir
# preferiblemente en sus respectivos archivos de perfil (application-dev.properties).
# Sin embargo, para simplificar el desarrollo local, se incluyen aquí.
# ==============================================================================

# ==============================================================================
# 1. INFORMACIÓN GENERAL DE LA APLICACIÓN
# ==============================================================================
# Nombre identificativo de la aplicación. Se utiliza en los logs, métricas
# de monitoreo y metadatos de Spring Boot.
spring.application.name=HostFlow Backend

# Carga las variables locales desde backend/.env (archivo no versionado).
# Si el archivo no existe, la aplicación arranca igualmente ("optional").
spring.config.import=optional:file:.env[.properties],optional:file:backend/.env[.properties]

# ==============================================================================
# 2. CONFIGURACIÓN DEL SERVIDOR WEB (TOMCAT)
# ==============================================================================
# Puerto en el que escuchará el servidor embebido.
server.port=8080

# Ruta base (context path) para todos los endpoints de la API REST.
# Centraliza el enrutamiento (ej. http://localhost:8080/api/v1/auth/login).
server.servlet.context-path=/api/v1

# ==============================================================================
# 3. CONFIGURACIÓN DE BASE DE DATOS (PostgreSQL)
# ==============================================================================
# Configuración de conexión a PostgreSQL para desarrollo local.
spring.datasource.url=jdbc:postgresql://localhost:5432/hostflow_dev

# Driver oficial de PostgreSQL para JDBC
spring.datasource.driver-class-name=org.postgresql.Driver

# Credenciales de acceso a la base de datos
# ⚠️ En producción, usar variables de entorno para mayor seguridad.
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}

# ==============================================================================
# 4. CONFIGURACIÓN JPA / HIBERNATE
# ==============================================================================
# Estrategia de gestión del esquema: "update" crea/actualiza tablas automáticamente.
spring.jpa.hibernate.ddl-auto=update

# Muestra las consultas SQL generadas por Hibernate en la consola (útil para debug).
spring.jpa.show-sql=true

# Dialecto de PostgreSQL para que Hibernate genere SQL optimizado.
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# Deshabilita el patrón "Open Session in View" (OSIV) para evitar fugas de
# conexiones y mejorar el rendimiento durante la serialización JSON.
spring.jpa.open-in-view=false

# ==============================================================================
# 5. CONFIGURACIÓN DE FLYWAY (Migraciones de Base de Datos)
# ==============================================================================
# Desactivado en desarrollo para evitar conflictos con Hibernate (ddl-auto=update).
# En producción, debe activarse (true) para un control estricto de versiones.
spring.flyway.enabled=false

# ==============================================================================
# 6. CONFIGURACIÓN DE SEGURIDAD Y JWT (JSON Web Token)
# ==============================================================================
# Clave secreta para firmar y verificar tokens JWT.
# ⚠️ En producción, sobrescribir con variable de entorno (JWT_SECRET) de 32+ caracteres.
jwt.secret=${JWT_SECRET}

# Tiempo de vida (TTL) del token de acceso en milisegundos (86400000 ms = 24 horas).
jwt.expiration=86400000

# Tiempo de vida (TTL) del token de refresco en milisegundos (604800000 ms = 7 días).
jwt.refresh-expiration=604800000

# Identificador del emisor (Issuer claim 'iss') en el payload del JWT.
jwt.issuer=HostFlow

# ==============================================================================
# 7. CONFIGURACIÓN DE SERIALIZACIÓN JSON (JACKSON)
# ==============================================================================
# Mantiene el formato de fecha estándar ISO-8601 legible en lugar de timestamps numéricos.
spring.jackson.serialization.write-dates-as-timestamps=false

# Excluye del JSON de respuesta cualquier campo que tenga valor nulo (null),
# limpiando la respuesta y reduciendo el consumo de ancho de banda.
spring.jackson.default-property-inclusion=non_null

# ==============================================================================
# 8. CONFIGURACIÓN DE DOCUMENTACIÓN API (SWAGGER / OPENAPI 3)
# ==============================================================================
# Rutas base para la generación de la especificación OpenAPI y la interfaz UI.
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html

# Ordena alfabéticamente las etiquetas y operaciones para mejorar la UX en Swagger.
springdoc.swagger-ui.tags-sorter=alpha
springdoc.swagger-ui.operations-sorter=alpha

# ==============================================================================
# 9. CONFIGURACIÓN DE CORREO ELECTRÓNICO (SMTP - Gmail)
# ==============================================================================
# Configuración SMTP para el envío REAL de correos electrónicos (recuperación de
# contraseña, verificación de email, etc.).
#
# ⚠️ CRÍTICO: Para Gmail, NO se usa la contraseña normal de tu cuenta.
# Debes usar una "Contraseña de aplicación" (App Password) de 16 caracteres
# generada desde: https://myaccount.google.com/apppasswords
# ==============================================================================
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${MAIL_USERNAME:tu_correo}
spring.mail.password=${MAIL_PASSWORD:cambiar}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true

# ==============================================================================
# 10. REGLAS DE NEGOCIO ESPECÍFICAS DE HOSTFLOW
# ==============================================================================
# Tiempo de validez del código de recuperación de contraseña en minutos.
app.password-reset.expiration-minutes=60

# Longitud del código numérico aleatorio generado para la recuperación.
app.password-reset.code-length=6

# ==============================================================================
# 11. CONFIGURACIÓN DE LOGGING
# ==============================================================================
# Niveles de log para diferentes paquetes. DEBUG para desarrollo detallado.
logging.level.com.hostflow=DEBUG
logging.level.org.springframework.security=DEBUG
logging.level.org.hibernate.SQL=DEBUG

app.admin.password=${ADMIN_PASSWORD}
