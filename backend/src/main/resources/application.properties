# ==============================================================================
# HostFlow - Configuraci\u00F3n Base de la Aplicaci\u00F3n (Global)
# ==============================================================================
# HostFlow - Configuraci\u00F3n Base de la Aplicaci\u00F3n (Global)
# ==============================================================================
# Este archivo contiene la configuraci\u00F3n com\u00FAn y por defecto que se aplica a
# TODOS los entornos (desarrollo, pruebas, producci\u00F3n).
#
# PRINCIPIO DE DISE\u00D1O: Las configuraciones espec\u00EDficas de infraestructura
# (base de datos, JPA/Hibernate, Flyway, correo electr\u00F3nico) deben residir
# preferiblemente en sus respectivos archivos de perfil (application-dev.properties,
# application-prod.properties). Sin embargo, para simplificar el desarrollo local,
# se incluyen aqu\u00ED con valores fallback que pueden ser sobrescritos.
#
# @author HostFlow Team
# @version 2.0.0
# ==============================================================================

# ==============================================================================
# 0. PERFIL ACTIVO (Opcional pero recomendado para desarrollo local)
# ==============================================================================
# Descomenta la siguiente l\u00EDnea para activar autom\u00E1ticamente el perfil 'dev'
# al iniciar la aplicaci\u00F3n, cargando as\u00ED las configuraciones espec\u00EDficas de
# desarrollo (como logs detallados o URLs de APIs de tasas de cambio).
#
# Ejemplo de uso:
#   spring.profiles.active=dev
#
# Nota: En producci\u00F3n, es preferible especificar el perfil mediante variable
# de entorno: SPRING_PROFILES_ACTIVE=prod
# ==============================================================================
# spring.profiles.active=dev

# ==============================================================================
# 1. INFORMACI\u00D3N GENERAL DE LA APLICACI\u00D3N
# ==============================================================================
# Nombre identificativo de la aplicaci\u00F3n. Se utiliza en los logs, m\u00E9tricas
# de monitoreo y metadatos de Spring Boot Actuator.
spring.application.name=HostFlow Backend

# Carga las variables locales desde backend/.env (archivo no versionado en Git).
# Si el archivo no existe, la aplicaci\u00F3n arranca igualmente gracias a "optional".
# Esto permite tener credenciales sensibles fuera del repositorio.
spring.config.import=optional:file:.env[.properties],optional:file:backend/.env[.properties]

# ==============================================================================
# 2. CONFIGURACI\u00D3N DEL SERVIDOR WEB (TOMCAT EMBEBIDO)
# ==============================================================================
# Puerto en el que escuchar\u00E1 el servidor embebido de Tomcat.
# El puerto 8080 es el est\u00E1ndar para aplicaciones Spring Boot.
# PRINCIPIO DE DISE\u00D1O: Las configuraciones espec\u00EDficas de infraestructura
# (base de datos, JPA/Hibernate, Flyway, correo electr\u00F3nico) deben residir
# preferiblemente en sus respectivos archivos de perfil (application-dev.properties).
# Sin embargo, para simplificar el desarrollo local, se incluyen aqu\u00ED.
# ==============================================================================

# ==============================================================================
# 1. INFORMACI\u00D3N GENERAL DE LA APLICACI\u00D3N
# ==============================================================================
# Nombre identificativo de la aplicaci\u00F3n. Se utiliza en los logs, m\u00E9tricas
# de monitoreo y metadatos de Spring Boot.
spring.application.name=HostFlow Backend

# Carga las variables locales desde backend/.env (archivo no versionado).
# Si el archivo no existe, la aplicaci\u00F3n arranca igualmente ("optional").
spring.config.import=optional:file:.env[.properties],optional:file:backend/.env[.properties]

# ==============================================================================
# 2. CONFIGURACI\u00D3N DEL SERVIDOR WEB (TOMCAT)
# ==============================================================================
# Puerto en el que escuchar\u00E1 el servidor embebido.
server.port=8080

# Ruta base (context path) para todos los endpoints de la API REST.
# Centraliza el enrutamiento bajo un versionado claro (v1).
# Ejemplo: http://localhost:8080/api/v1/auth/login
server.servlet.context-path=/api/v1

# ==============================================================================
# 3. CONFIGURACI\u00D3N DE BASE DE DATOS (PostgreSQL)
# ==============================================================================
# URL de conexi\u00F3n a PostgreSQL para desarrollo local.
# Formato: jdbc:postgresql://{host}:{port}/{database_name}
# Configuraci\u00F3n de conexi\u00F3n a PostgreSQL para desarrollo local.
spring.datasource.url=jdbc:postgresql://localhost:5432/hostflow_dev

# Driver oficial de PostgreSQL para JDBC.
# Spring Boot lo detecta autom\u00E1ticamente, pero se declara expl\u00EDcitamente
# para mayor claridad y control.
spring.datasource.driver-class-name=org.postgresql.Driver

# Credenciales de acceso a la base de datos.
# \u26A0\uFE0F IMPORTANTE: En producci\u00F3n, estos valores DEBEN provenir de variables
# de entorno del sistema operativo o del orquestador (Docker, Kubernetes, etc.).
# Nunca hardcodear credenciales sensibles en el repositorio.
# Credenciales de acceso a la base de datos
# \u26A0\uFE0F En producci\u00F3n, usar variables de entorno para mayor seguridad.
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}

# ==============================================================================
# 4. CONFIGURACI\u00D3N JPA / HIBERNATE (ORM)
# ==============================================================================
# Estrategia de gesti\u00F3n del esquema de base de datos.
#
# Opciones disponibles:
#   - none: No realiza ninguna acci\u00F3n (requiere esquema preexistente).
#   - validate: Valida que el esquema coincida con las entidades.
#   - update: Actualiza autom\u00E1ticamente el esquema (agrega tablas/columnas).
#   - create: Crea el esquema al iniciar (pierde datos existentes).
#   - create-drop: Crea al iniciar y elimina al cerrar.
#
# \u26A0\uFE0F En desarrollo: "update" es conveniente pero puede tener limitaciones.
# \u26A0\uFE0F En producci\u00F3n: DEBE ser "validate" o "none" para control estricto.
spring.jpa.hibernate.ddl-auto=update

# Muestra las consultas SQL generadas por Hibernate en la consola.
# \u00DAtil para debugging y optimizaci\u00F3n de queries en desarrollo.
# En producci\u00F3n, debe desactivarse para mejorar el rendimiento.
spring.jpa.show-sql=true

# Dialecto de PostgreSQL para que Hibernate genere SQL optimizado y nativo.
# Aprovecha caracter\u00EDsticas espec\u00EDficas de PostgreSQL (JSONB, arrays, etc.).
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# Deshabilita el patr\u00F3n "Open Session in View" (OSIV).
# Esto evita fugas de conexiones a la base de datos y mejora el rendimiento
# durante la serializaci\u00F3n JSON, forzando a que las consultas se ejecuten
# expl\u00EDcitamente en la capa de servicio.
# Deshabilita el patr\u00F3n "Open Session in View" (OSIV) para evitar fugas de
# conexiones y mejorar el rendimiento durante la serializaci\u00F3n JSON.
spring.jpa.open-in-view=false

# Formato de las consultas SQL en los logs (m\u00E1s legible).
spring.jpa.properties.hibernate.format_sql=true

# ==============================================================================
# 5. CONFIGURACI\u00D3N DE FLYWAY (Migraciones de Base de Datos)
# ==============================================================================
# Flyway es una herramienta de versionado de base de datos que permite
# aplicar migraciones SQL de forma controlada y reproducible.
#
# En desarrollo: Desactivado para evitar conflictos con Hibernate (ddl-auto=update).
# En producci\u00F3n: DEBE activarse (true) para un control estricto de versiones
# del esquema. Todas las migraciones van en src/main/resources/db/migration/.
spring.flyway.enabled=false

# Ubicaci\u00F3n de los scripts de migraci\u00F3n SQL.
spring.flyway.locations=classpath:db/migration

# Si la base de datos ya tiene tablas, Flyway asumir\u00E1 que el estado actual
# es la "l\u00EDnea base" y comenzar\u00E1 a aplicar migraciones desde la siguiente versi\u00F3n.
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=5

# ==============================================================================
# 6. CONFIGURACI\u00D3N DE SEGURIDAD Y JWT (JSON Web Token)
# ==============================================================================
# Clave secreta para firmar y verificar tokens JWT.
# \u26A0\uFE0F En producci\u00F3n, sobrescribir con variable de entorno (JWT_SECRET) de 32+ caracteres.
jwt.secret=${JWT_SECRET:HostFlowSecretKey2026VeryLongSecretKeyForHS512Algorithm}

# Tiempo de vida (TTL) del token de acceso en milisegundos.
# 86400000 ms = 24 horas. Los usuarios deben autenticarse diariamente.
jwt.expiration=86400000

# Tiempo de vida (TTL) del token de refresco en milisegundos.
# 604800000 ms = 7 d\u00EDas. Permite renovar el token de acceso sin login.
jwt.refresh-expiration=604800000

# Identificador del emisor (Issuer claim 'iss') en el payload del JWT.
# Se utiliza para validar que el token fue generado por HostFlow.
jwt.issuer=HostFlow

# ==============================================================================
# 7. CONFIGURACI\u00D3N DE SERIALIZACI\u00D3N JSON (JACKSON)
# ==============================================================================
# Mantiene el formato de fecha est\u00E1ndar ISO-8601 legible en lugar de
# timestamps num\u00E9ricos. Ejemplo: "2026-10-27T14:30:00" vs 1698422400000
spring.jackson.serialization.write-dates-as-timestamps=false

# Excluye del JSON de respuesta cualquier campo que tenga valor nulo (null),
# limpiando la respuesta y reduciendo el consumo de ancho de banda.
# Ejemplo: {"name": "Hotel", "description": null} \u2192 {"name": "Hotel"}
spring.jackson.default-property-inclusion=non_null

# ==============================================================================
# 8. CONFIGURACI\u00D3N DE DOCUMENTACI\u00D3N API (SWAGGER / OPENAPI 3)
# ==============================================================================
# Rutas base para la generaci\u00F3n de la especificaci\u00F3n OpenAPI y la interfaz UI.
#
# - Swagger UI: http://localhost:8080/api/v1/swagger-ui.html
# - Especificaci\u00F3n JSON: http://localhost:8080/api/v1/api-docs
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html

# Ordena alfab\u00E9ticamente las etiquetas (tags) y operaciones (endpoints)
# para mejorar la experiencia de usuario en Swagger UI.
springdoc.swagger-ui.tags-sorter=alpha
springdoc.swagger-ui.operations-sorter=alpha

# Habilita la documentaci\u00F3n de Swagger en todos los entornos.
# En producci\u00F3n, puede desactivarse por seguridad.
# springdoc.api-docs.enabled=true

# ==============================================================================
# 9. CONFIGURACI\u00D3N DE CORREO ELECTR\u00D3NICO (SMTP - Gmail)
# ==============================================================================
# Configuraci\u00F3n SMTP para el env\u00EDo REAL de correos electr\u00F3nicos:
# - Recuperaci\u00F3n de contrase\u00F1a
# - Verificaci\u00F3n de email
# - Notificaciones de reservas
# Configuraci\u00F3n SMTP para el env\u00EDo REAL de correos electr\u00F3nicos (recuperaci\u00F3n de
# contrase\u00F1a, verificaci\u00F3n de email, etc.).
#
# \u26A0\uFE0F CR\u00CDTICO: Para Gmail, NO se usa la contrase\u00F1a normal de tu cuenta.
# Debes usar una "Contrase\u00F1a de aplicaci\u00F3n" (App Password) de 16 caracteres
# generada desde: https://myaccount.google.com/apppasswords
#
# Requisitos previos:
# 1. Activar la verificaci\u00F3n en 2 pasos en tu cuenta de Google.
# 2. Generar una App Password espec\u00EDfica para HostFlow.
# 3. Guardar la contrase\u00F1a en la variable de entorno MAIL_PASSWORD.
# ==============================================================================
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${MAIL_USERNAME:tu_correo@gmail.com}
spring.mail.password=${MAIL_PASSWORD:tu_app_password_de_16_caracteres}

# Habilita autenticaci\u00F3n SMTP (requiere username/password).
spring.mail.properties.mail.smtp.auth=true

# Habilita STARTTLS para cifrar la conexi\u00F3n (puerto 587).
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true

# 2. Para Brevo (Producci\u00F3n): Agrega tu API Key de Resend aqu\u00ED
# (O mejor a\u00FAn, agr\u00E9gala como Variable de Entorno en el dashboard de Render)
brevo.api.key=${BREVO_API_KEY:}

# Si resend.api.key est\u00E1 presente y empieza con "re_", usar\u00E1 Resend.
# Si est\u00E1 vac\u00EDa, usar\u00E1 Gmail SMTP autom\u00E1ticamente.

# Timeout de conexi\u00F3n en milisegundos (evita bloqueos si el servidor no responde).
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.writetimeout=5000

# ==============================================================================
# 10. REGLAS DE NEGOCIO ESPEC\u00CDFICAS DE HOSTFLOW
# ==============================================================================
# Tiempo de validez del c\u00F3digo de recuperaci\u00F3n de contrase\u00F1a en minutos.
# Despu\u00E9s de este tiempo, el c\u00F3digo expira y debe solicitarse uno nuevo.
app.password-reset.expiration-minutes=60

# Longitud del c\u00F3digo num\u00E9rico aleatorio generado para la recuperaci\u00F3n.
# 6 d\u00EDgitos = 1,000,000 combinaciones posibles (seguridad razonable).
app.password-reset.code-length=6

# ==============================================================================
# 11. CONFIGURACI\u00D3N DE LOGGING (REGISTRO DE EVENTOS)
# ==============================================================================
# Niveles de log para diferentes paquetes.
#
# Niveles disponibles (de menor a mayor detalle):
#   - ERROR: Solo errores cr\u00EDticos que impiden la operaci\u00F3n.
#   - WARN: Advertencias que no detienen la aplicaci\u00F3n pero requieren atenci\u00F3n.
#   - INFO: Informaci\u00F3n general del flujo de la aplicaci\u00F3n (recomendado en prod).
#   - DEBUG: Detalles del flujo de la aplicaci\u00F3n (recomendado en desarrollo).
#   - TRACE: M\u00E1ximo detalle, incluye valores de variables (muy verboso).
# ==============================================================================
logging.level.com.hostflow=DEBUG
logging.level.org.springframework.security=DEBUG
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.flywaydb=INFO
logging.level.org.springframework.mail=DEBUG

# Formato de los logs (incluye timestamp, nivel, thread, clase y mensaje).
# logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n

# ==============================================================================
# 12. CONFIGURACI\u00D3N DE SEGURIDAD - CONTRASE\u00D1A ADMIN INICIAL
# ==============================================================================
# Contrase\u00F1a por defecto para el usuario administrador creado en el
# DataInitializer durante el arranque de la aplicaci\u00F3n.
#
# \u26A0\uFE0F CR\u00CDTICO: Cambiar inmediatamente en el archivo .env antes de cualquier
# despliegue. El admin tiene permisos totales sobre el sistema.
app.admin.password=${ADMIN_PASSWORD:adminPassword}

# ==============================================================================
# 13. TIEMPOS DE INACTIVIDAD POR ROL (en milisegundos)
# ==============================================================================
# Tiempo m\u00E1ximo sin actividad antes de cerrar sesi\u00F3n autom\u00E1ticamente.
# El frontend usar\u00E1 estos valores para mostrar el aviso y hacer logout.
#
# Owner: 10 minutos (600000 ms) - Sesi\u00F3n m\u00E1s corta por seguridad.
# Admin: 15 minutos (900000 ms) - Sesi\u00F3n ligeramente m\u00E1s larga.
app.inactivity.owner-milliseconds=600000
app.inactivity.admin-milliseconds=900000

# Tiempo antes del cierre para mostrar el aviso (warning).
# 60 segundos (60000 ms) antes del logout, se muestra un modal de advertencia.
app.inactivity.warning-before-milliseconds=60000

# ==============================================================================
# 14. CONFIGURACI\u00D3N DE SEGURIDAD - BLOQUEO DE CUENTA
# ==============================================================================
# N\u00FAmero m\u00E1ximo de intentos fallidos de login antes de bloquear la cuenta.
# Protege contra ataques de fuerza bruta.
app.security.max-failed-attempts=5

# Tiempo de bloqueo de la cuenta en minutos (despu\u00E9s de alcanzar el m\u00E1ximo).
# Durante este per\u00EDodo, el usuario no puede intentar login aunque la contrase\u00F1a
# sea correcta.
app.security.block-duration-minutes=60

# Per\u00EDodo de tiempo en minutos para contar los intentos fallidos.
# Los intentos fallidos m\u00E1s antiguos que este per\u00EDodo no se cuentan.
# Ejemplo: Si es 60 minutos, se cuentan solo los intentos de la \u00FAltima hora.
app.security.failed-attempts-window-minutes=60

# ==============================================================================
# 15. CONFIGURACI\u00D3N DE CLOUDINARY (Carga de Im\u00E1genes en la Nube)
# ==============================================================================
# Cloudinary es el servicio de almacenamiento y optimizaci\u00F3n de im\u00E1genes
# utilizado por HostFlow para:
# - Logotipos de alojamientos
# - Galer\u00EDa de im\u00E1genes
# - Im\u00E1genes de servicios adicionales
#
# Las credenciales deben definirse como variables de entorno o en backend/.env
# Nunca subirlas al repositorio.
#
# Instrucciones:
# 1. Crear cuenta en https://cloudinary.com/users/register/free
# 2. Obtener Cloud Name, API Key y API Secret del dashboard
# 3. Guardar en variables de entorno
# ==============================================================================
cloudinary.cloud-name=${CLOUDINARY_CLOUD_NAME:tu_cloud_name}
cloudinary.api-key=${CLOUDINARY_API_KEY:tu_api_key}
cloudinary.api-secret=${CLOUDINARY_API_SECRET:tu_api_secret}

# Carpeta predeterminada en Cloudinary donde se almacenar\u00E1n las im\u00E1genes.
# Ejemplo: hostflow/gallery/, hostflow/logos/, hostflow/additional-services/
cloudinary.folder=${CLOUDINARY_FOLDER:hostflow}

# L\u00EDmites HTTP para las pruebas de carga de im\u00E1genes.
# max-file-size: Tama\u00F1o m\u00E1ximo por archivo individual.
# max-request-size: Tama\u00F1o m\u00E1ximo total de la petici\u00F3n multipart.
#
# \u26A0\uFE0F En producci\u00F3n, ajustar seg\u00FAn necesidades:
# - Logo: 5 MB es suficiente.
# - Galer\u00EDa: 5 MB por imagen es razonable.
# - Servicios adicionales: 2 MB por imagen (configurado en el servicio).
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=10MB

# ==============================================================================
# 16. CONFIGURACI\u00D3N MULTIMONEDA Y CONVERSI\u00D3N AUTOM\u00C1TICA
# ==============================================================================
# Moneda base por defecto para alojamientos nuevos.
# Todos los precios internos se almacenan en esta moneda.
app.accommodation.default-currency=ARS

# ------------------------------------------------------------------------------
# APIs de tasas de cambio (100% gratuitas, sin API Key requerida)
# ------------------------------------------------------------------------------
# DolarAPI.com: cotizaciones del d\u00F3lar argentino (blue, oficial, MEP, cripto, etc.)
# 100% gratuita, sin API key, actualizada en tiempo real.
# Documentaci\u00F3n: https://dolarapi.com
app.exchange-rate.dolarapi.url=https://dolarapi.com/v1/dolares

# Frankfurter API: tasas del Banco Central Europeo (EUR y otras monedas)
# Gratuita, sin API key, actualizada diariamente (d\u00EDas h\u00E1biles).
# Documentaci\u00F3n: https://frankfurter.dev
app.exchange-rate.frankfurter.url=https://api.frankfurter.dev/v1/latest

# Si la tasa autom\u00E1tica tiene m\u00E1s de X horas, se considera obsoleta (warning en logs)
# pero se sigue usando para no bloquear la operaci\u00F3n del sistema.
# Esto permite que la aplicaci\u00F3n funcione incluso si las APIs externas fallan.
app.exchange-rate.max-age-hours=4

# ==============================================================================
# 17. CONFIGURACI\u00D3N DE RENDIMIENTO Y POOL DE CONEXIONES (HikariCP)
# ==============================================================================
# HikariCP es el pool de conexiones por defecto de Spring Boot.
# Estas configuraciones optimizan el rendimiento en desarrollo.
#
# En producci\u00F3n, ajustar seg\u00FAn la carga esperada:
# - maximum-pool-size: 20-50 (dependiendo de la capacidad de la BD)
# - minimum-idle: 10-20
# - connection-timeout: 30000
#
# spring.datasource.hikari.maximum-pool-size=10
# spring.datasource.hikari.minimum-idle=5
# spring.datasource.hikari.connection-timeout=30000
# spring.datasource.hikari.idle-timeout=600000
# spring.datasource.hikari.max-lifetime=1800000

# ==============================================================================
# 18. CONFIGURACI\u00D3N DE ACTUATORS (Monitoreo y Health Checks)
# ==============================================================================
# Spring Boot Actuator proporciona endpoints para monitoreo y gesti\u00F3n.
#
# Endpoints disponibles:
# - /actuator/health: Estado de salud de la aplicaci\u00F3n
# - /actuator/info: Informaci\u00F3n de la aplicaci\u00F3n
# - /actuator/metrics: M\u00E9tricas de rendimiento
# - /actuator/env: Variables de entorno
#
# En producci\u00F3n, exponer solo los necesarios y proteger con autenticaci\u00F3n.
# management.endpoints.web.exposure.include=health,info,metrics
# management.endpoint.health.show-details=when_authorized

# ==============================================================================
# FIN DE LA CONFIGURACI\u00D3N
# ==============================================================================
# Si llegaste hasta aqu\u00ED, \u00A1felicitaciones! \uD83C\uDF89
# Recuerda:
# 1. Nunca subir el archivo .env al repositorio.
# 2. En producci\u00F3n, usar variables de entorno del sistema operativo.
