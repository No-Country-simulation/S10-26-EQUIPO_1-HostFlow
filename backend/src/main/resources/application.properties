# ==============================================================================
# HostFlow - Configuración Base de la Aplicación (Global)
# ==============================================================================
# Este archivo contiene la configuración común y por defecto que se aplica a
# TODOS los entornos (desarrollo, pruebas, producción).
#
# PRINCIPIO DE DISEÑO: Las configuraciones específicas de infraestructura
# (base de datos, JPA, Flyway, correo) deben residir preferiblemente en sus
# respectivos archivos de perfil (application-dev.properties, application-prod.properties).
# Aquí solo se incluyen valores fallback seguros que pueden ser sobrescritos.
#
# @author HostFlow Team
# @version 3.0.0
# ==============================================================================

# ==============================================================================
# 1. INFORMACIÓN GENERAL Y PERFILES
# ==============================================================================
# Nombre identificativo de la aplicación (visible en logs y Actuator).
spring.application.name=HostFlow Backend

# Carga las variables de entorno locales desde el archivo .env (no versionado en Git).
# El prefijo "optional:" permite que la aplicación arranque si el archivo no existe.
spring.config.import=optional:file:.env[.properties],optional:file:backend/.env[.properties]

# Descomenta la siguiente línea para activar el perfil 'dev' por defecto en local.
# En producción, usa la variable de entorno: SPRING_PROFILES_ACTIVE=prod
# spring.profiles.active=dev

# ==============================================================================
# 2. CONFIGURACIÓN DEL SERVIDOR WEB (Tomcat Embebido)
# ==============================================================================
# server.port=8080
server.port=${PORT:8080}
server.servlet.context-path=/api/v1

# ==============================================================================
# 3. CONFIGURACIÓN DE BASE DE DATOS (PostgreSQL)
# ==============================================================================
spring.datasource.url=jdbc:postgresql://localhost:5432/hostflow_dev
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}

# ==============================================================================
# 4. CONFIGURACIÓN JPA / HIBERNATE (ORM)
# ==============================================================================
# 'update' para desarrollo ágil. ⚠️ EN PRODUCCIÓN DEBE SER 'validate' o 'none'.
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# Deshabilita "Open Session in View" (OSIV) para evitar fugas de conexiones
# y forzar que las consultas se ejecuten explícitamente en la capa de servicio.
spring.jpa.open-in-view=false

# ==============================================================================
# 5. CONFIGURACIÓN DE FLYWAY (Migraciones de Base de Datos)
# ==============================================================================
# Desactivado por defecto para evitar conflictos con 'ddl-auto=update' en desarrollo local.
# Se activará explícitamente (true) en application-prod.properties para control estricto.
spring.flyway.enabled=false
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=5

# ==============================================================================
# 6. SEGURIDAD Y JWT (JSON Web Token)
# ==============================================================================
# ⚠️ CRÍTICO: En producción, sobrescribir con una variable de entorno (JWT_SECRET)
# de al menos 64 caracteres para el algoritmo HS512.
jwt.secret=${JWT_SECRET:HostFlowSecretKey2026VeryLongSecretKeyForHS512AlgorithmFallbackOnly}
jwt.expiration=86400000
jwt.refresh-expiration=604800000
jwt.issuer=HostFlow

# Contraseña por defecto para el usuario administrador creado por DataInitializer.
# ⚠️ CRÍTICO: Cambiar inmediatamente en el archivo .env antes de cualquier despliegue.
app.admin.password=${ADMIN_PASSWORD:adminPassword}

# ==============================================================================
# 7. REGLAS DE NEGOCIO ESPECÍFICAS DE HOSTFLOW
# ==============================================================================
# --- Recuperación de Contraseña ---
app.password-reset.expiration-minutes=60
app.password-reset.code-length=6

# --- Tiempos de Inactividad por Rol (en milisegundos) ---
app.inactivity.owner-milliseconds=600000
app.inactivity.admin-milliseconds=900000
app.inactivity.warning-before-milliseconds=60000

# --- Bloqueo de Cuenta por Fuerza Bruta ---
app.security.max-failed-attempts=5
app.security.block-duration-minutes=60
app.security.failed-attempts-window-minutes=60

# --- Gestión de Reservas ---
app.reservations.link-expiration-hours=24
app.reservations.frontend-confirm-url=http://localhost:3000/reservations/confirm
app.reservations.tax-percentage=10

# ==============================================================================
# 8. CORREO ELECTRÓNICO (SMTP Híbrido / Brevo)
# ==============================================================================
spring.mail.host=${MAIL_HOST:smtp.gmail.com}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:tu_correo@gmail.com}
spring.mail.password=${MAIL_PASSWORD:tu_app_password_de_16_caracteres}

spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.writetimeout=5000

# API Key para servicios de correo transaccional modernos (ej. Brevo/Resend).
# Si está presente y es válida, el EmailService la priorizará sobre SMTP.
brevo.api.key=${BREVO_API_KEY:}

# ==============================================================================
# 9. CLOUDINARY (Carga de Imágenes en la Nube)
# ==============================================================================
cloudinary.cloud-name=${CLOUDINARY_CLOUD_NAME:tu_cloud_name}
cloudinary.api-key=${CLOUDINARY_API_KEY:tu_api_key}
cloudinary.api-secret=${CLOUDINARY_API_SECRET:tu_api_secret}
cloudinary.folder=${CLOUDINARY_FOLDER:hostflow}

# Límites HTTP para la carga de archivos multipart.
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=10MB

# ==============================================================================
# 10. MULTIMONEDA Y CONVERSIÓN AUTOMÁTICA
# ==============================================================================
app.accommodation.default-currency=ARS

# APIs de tasas de cambio (gratuitas, sin API Key requerida)
app.exchange-rate.dolarapi.url=https://dolarapi.com/v1/dolares
app.exchange-rate.frankfurter.url=https://api.frankfurter.dev/v1/latest
app.exchange-rate.max-age-hours=4

# ==============================================================================
# 11. SERIALIZACIÓN JSON (Jackson)
# ==============================================================================
# Mantiene el formato de fecha estándar ISO-8601 legible en lugar de timestamps.
spring.jackson.serialization.write-dates-as-timestamps=false
# Excluye del JSON de respuesta cualquier campo que tenga valor nulo (null).
spring.jackson.default-property-inclusion=non_null

# ==============================================================================
# 12. DOCUMENTACIÓN API (Swagger / OpenAPI 3)
# ==============================================================================
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.tags-sorter=alpha
springdoc.swagger-ui.operations-sorter=alpha
# Habilitado por defecto. Desactivar en producción por seguridad.
springdoc.api-docs.enabled=true
springdoc.swagger-ui.enabled=true

# ==============================================================================
# 13. CONFIGURACIÓN DE LOGGING
# ==============================================================================
logging.level.com.hostflow=DEBUG
logging.level.org.springframework.security=DEBUG
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.flywaydb=INFO
logging.level.org.springframework.mail=DEBUG

# ==============================================================================
# 14. RENDIMIENTO Y MONITOREO (HikariCP & Actuator)
# ==============================================================================
# Configuraciones de HikariCP (descomentar y ajustar en producción según carga)
# spring.datasource.hikari.maximum-pool-size=20
# spring.datasource.hikari.minimum-idle=10
# spring.datasource.hikari.connection-timeout=30000

# Actuator: Exponer solo endpoints necesarios y proteger en producción.
# management.endpoints.web.exposure.include=health,info,metrics
# management.endpoint.health.show-details=when_authorized

# ==============================================================================
# FIN DE LA CONFIGURACIÓN
# ==============================================================================