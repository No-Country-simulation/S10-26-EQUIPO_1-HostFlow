# ==============================================================================
# HostFlow - Configuraci\u00F3n Base de la Aplicaci\u00F3n (Global)
# ==============================================================================
# Configuraci\u00F3n com\u00FAn y por defecto para TODOS los entornos.
#
# PRINCIPIO DE DISE\u00D1O:
# - Infraestructura espec\u00EDfica (DB, JPA, Flyway, correo, logging, Swagger)
#   se sobrescribe en application-dev.properties / application-prod.properties.
# - Aqu\u00ED solo van valores compartidos y fallbacks seguros para desarrollo local.
#
# @author HostFlow Team
# @version 3.1.0 (limpieza: duplicados, comentarios obsoletos, perfil prod real)
# ==============================================================================

# ==============================================================================
# 1. INFORMACI\u00D3N GENERAL Y PERFILES
# ==============================================================================
spring.application.name=HostFlow Backend

# Carga variables locales desde .env (no versionado en Git).
# "optional:" permite arrancar si el archivo no existe.
spring.config.import=optional:file:.env[.properties],optional:file:backend/.env[.properties]

# Descomenta para activar el perfil 'dev' por defecto en local.
# En producci\u00F3n usa: SPRING_PROFILES_ACTIVE=prod
# spring.profiles.active=dev

# ==============================================================================
# 2. SERVIDOR WEB (Tomcat embebido)
# ==============================================================================
#server.port=8080
server.port=${PORT:8080}
server.servlet.context-path=/api/v1

# ==============================================================================
# 3. BASE DE DATOS (PostgreSQL) - fallback local
# ==============================================================================
# En prod se sobrescribe con DB_URL / credenciales de entorno (sin fallbacks d\u00E9biles).
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/hostflow_dev}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}

# ==============================================================================
# 4. JPA / HIBERNATE
# ==============================================================================
# 'update' solo como fallback local. En prod DEBE ser 'validate'.
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.open-in-view=false

# ==============================================================================
# 5. FLYWAY
# ==============================================================================
# Desactivado por defecto (desarrollo \u00E1gil con ddl-auto=update).
# Solo se activa en application-prod.properties.
spring.flyway.enabled=false
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=5

# ==============================================================================
# 6. SEGURIDAD Y JWT
# ==============================================================================
# En producci\u00F3n sobrescribir JWT_SECRET (m\u00EDn. 64 caracteres para HS512).
jwt.secret=${JWT_SECRET:HostFlowSecretKey2026VeryLongSecretKeyForHS512AlgorithmFallbackOnly}
jwt.expiration=86400000
jwt.refresh-expiration=604800000
jwt.issuer=HostFlow

# ==============================================================================
# 7. REGLAS DE NEGOCIO HOSTFLOW
# ==============================================================================
# Recuperaci\u00F3n de contrase\u00F1a
app.password-reset.expiration-minutes=60
app.password-reset.code-length=6

# Verificaci\u00F3n de correo
app.email-verification.expiration-minutes=60
app.email-verification.frontend-url=${APP_EMAIL_VERIFICATION_FRONTEND_URL:http://localhost:3000/verify-email}
app.email-verification.backend-url=${APP_EMAIL_VERIFICATION_BACKEND_URL:http://localhost:8080/api/v1/auth/verify-email}

# Inactividad por rol (ms)
app.inactivity.owner-milliseconds=600000
app.inactivity.admin-milliseconds=900000
app.inactivity.warning-before-milliseconds=60000

# Bloqueo por fuerza bruta
app.security.max-failed-attempts=5
app.security.block-duration-minutes=60
app.security.failed-attempts-window-minutes=60

# Reservas
app.reservations.link-expiration-hours=24
app.reservations.frontend-confirm-url=${APP_RESERVATIONS_FRONTEND_CONFIRM_URL:http://localhost:5173/reservations/confirm}
app.reservations.tax-percentage=10

# ==============================================================================
# 8. CORREO (SMTP / Brevo)
# ==============================================================================
# SMTP de respaldo (Gmail App Password). Si BREVO_API_KEY est\u00E1 definida y es
# v\u00E1lida, EmailService prioriza la API de Brevo.
spring.mail.host=${MAIL_HOST:smtp.gmail.com}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000

brevo.api.key=${BREVO_API_KEY:}

# ==============================================================================
# 9. CLOUDINARY
# ==============================================================================
cloudinary.cloud-name=${CLOUDINARY_CLOUD_NAME:}
cloudinary.api-key=${CLOUDINARY_API_KEY:}
cloudinary.api-secret=${CLOUDINARY_API_SECRET:}
cloudinary.folder=${CLOUDINARY_FOLDER:hostflow}

spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=10MB

# ==============================================================================
# 10. MULTIMONEDA Y CONVERSI\u00D3N
# ==============================================================================
app.accommodation.default-currency=ARS
app.exchange-rate.dolarapi.url=https://dolarapi.com/v1/dolares
app.exchange-rate.eras-api.url=https://open.er-api.com/v6/latest/ARS
# Reservada por si se reactiva m\u00E1s adelante (hoy el c\u00F3digo usa dolarapi + eras-api)
app.exchange-rate.frankfurter.url=https://api.frankfurter.dev/v1/latest
app.exchange-rate.max-age-hours=4

# ==============================================================================
# 11. SERIALIZACI\u00D3N JSON (Jackson)
# ==============================================================================
spring.jackson.serialization.write-dates-as-timestamps=false
spring.jackson.default-property-inclusion=non_null

# ==============================================================================
# 12. DOCUMENTACI\u00D3N API (Swagger / OpenAPI 3)
# ==============================================================================
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.tags-sorter=alpha
springdoc.swagger-ui.operations-sorter=alpha
# Habilitado por defecto; desactivar en prod.
springdoc.api-docs.enabled=true
springdoc.swagger-ui.enabled=true

# ==============================================================================
# 13. LOGGING (fallback; dev/prod lo sobrescriben)
# ==============================================================================
logging.level.com.hostflow=INFO
logging.level.org.springframework.security=INFO
logging.level.org.hibernate.SQL=WARN
logging.level.org.flywaydb=INFO
logging.level.org.springframework.mail=INFO

# ==============================================================================
# 14. RENDIMIENTO Y MONITOREO (opcional)
# ==============================================================================
# spring.datasource.hikari.maximum-pool-size=20
# spring.datasource.hikari.minimum-idle=5
# spring.datasource.hikari.connection-timeout=30000
# management.endpoints.web.exposure.include=health,info,metrics
# management.endpoint.health.show-details=when_authorized

# ==============================================================================
# L\u00CDMITES DE IM\u00C1GENES (galer\u00EDa, logo, servicios adicionales)
# ==============================================================================
# Validaci\u00F3n de negocio en CloudinaryImageService (antes de subir a Cloudinary).
# 2 MB = 2097152 bytes.
# spring.servlet.multipart.max-file-size debe ser >= app.images.max-size-bytes.
app.images.max-size-bytes=${APP_IMAGES_MAX_SIZE_BYTES:2097152}
