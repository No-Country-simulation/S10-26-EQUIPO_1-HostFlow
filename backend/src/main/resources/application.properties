# ==============================================================================
# ==============================================================================
# 19. CONFIGURACI\u00D3N DE RESERVAS
# ==============================================================================
# Horas de validez por defecto del enlace de confirmaci\u00F3n.
# Por defecto: 24 horas.
app.reservations.link-expiration-hours=24

# URL del frontend para la confirmaci\u00F3n de reservas.
# El token se appenda como query parameter: ?token=xxx
app.reservations.frontend-confirm-url=${APP_RESERVATIONS_FRONTEND_CONFIRM_URL:http://localhost:5173/reservations/confirm}

# Porcentaje de impuestos aplicados a las reservas.
# Por defecto: 10%
app.reservations.tax-percentage=10
