# ==============================================================================
# HostFlow - Perfil PRODUCCIÓN (prod)
# ==============================================================================
# Activa con: SPRING_PROFILES_ACTIVE=prod
#
# Principios:
# - Flyway gestiona el esquema; Hibernate solo valida (ddl-auto=validate).
# - Sin secretos ni credenciales en claro: todo vía variables de entorno.
# - Swagger desactivado. Logs en INFO. show-sql=false.
# - Fallbacks mínimos; preferir fallar al arrancar si falta un secreto crítico.
# ==============================================================================

# ==============================================================================
# 1. BASE DE DATOS
# ==============================================================================
# Obligatorias en el entorno de despliegue (Render, Docker, etc.).
spring.datasource.url=${DB_URL}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

# Pool HikariCP (ajustar según carga real)
spring.datasource.hikari.maximum-pool-size=${HIKARI_MAX_POOL_SIZE:20}
spring.datasource.hikari.minimum-idle=${HIKARI_MIN_IDLE:5}
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.idle-timeout=600000
spring.datasource.hikari.max-lifetime=1800000

# ==============================================================================
# 2. JPA / HIBERNATE
# ==============================================================================
# Solo valida el esquema. Las migraciones las aplica Flyway.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.open-in-view=false

# ==============================================================================
# 3. FLYWAY (activo solo en prod)
# ==============================================================================
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=5

# ==============================================================================
# 4. SEGURIDAD / JWT
# ==============================================================================
# JWT_SECRET debe definirse en el entorno (mín. 64 caracteres, HS512).
jwt.secret=${JWT_SECRET}
jwt.expiration=${JWT_EXPIRATION:86400000}
jwt.refresh-expiration=${JWT_REFRESH_EXPIRATION:604800000}
jwt.issuer=HostFlow

# ==============================================================================
# 5. CORREO (Brevo prioritario; SMTP de respaldo)
# ==============================================================================
# Preferir BREVO_API_KEY en producción. SMTP queda como fallback.
spring.mail.host=${MAIL_HOST:smtp.gmail.com}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000

brevo.api.key=${BREVO_API_KEY:}

# ==============================================================================
# 6. CLOUDINARY
# ==============================================================================
cloudinary.cloud-name=${CLOUDINARY_CLOUD_NAME}
cloudinary.api-key=${CLOUDINARY_API_KEY}
cloudinary.api-secret=${CLOUDINARY_API_SECRET}
cloudinary.folder=${CLOUDINARY_FOLDER:hostflow}

spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=10MB

# ==============================================================================
# 7. URLs PÚBLICAS / FRONTEND
# ==============================================================================
app.email-verification.expiration-minutes=60
app.email-verification.frontend-url=${APP_EMAIL_VERIFICATION_FRONTEND_URL}
app.email-verification.backend-url=${APP_EMAIL_VERIFICATION_BACKEND_URL}

app.reservations.link-expiration-hours=24
app.reservations.frontend-confirm-url=${APP_RESERVATIONS_FRONTEND_CONFIRM_URL}
app.reservations.tax-percentage=10

app.password-reset.expiration-minutes=60
app.password-reset.code-length=6

app.inactivity.owner-milliseconds=600000
app.inactivity.admin-milliseconds=900000
app.inactivity.warning-before-milliseconds=60000

app.security.max-failed-attempts=5
app.security.block-duration-minutes=60
app.security.failed-attempts-window-minutes=60

# ==============================================================================
# 8. MULTIMONEDA
# ==============================================================================
app.accommodation.default-currency=ARS
app.exchange-rate.dolarapi.url=https://dolarapi.com/v1/dolares
app.exchange-rate.eras-api.url=https://open.er-api.com/v6/latest/ARS
# Reservada (código actual usa dolarapi + eras-api)
app.exchange-rate.frankfurter.url=https://api.frankfurter.dev/v1/latest
app.exchange-rate.max-age-hours=4

# ==============================================================================
# 9. SWAGGER (desactivado en producción)
# ==============================================================================
springdoc.api-docs.enabled=false
springdoc.swagger-ui.enabled=false

# ==============================================================================
# 10. LOGGING
# ==============================================================================
logging.level.com.hostflow=INFO
logging.level.org.springframework.security=WARN
logging.level.org.hibernate.SQL=WARN
logging.level.org.hibernate.type.descriptor.sql=WARN
logging.level.org.flywaydb=INFO
logging.level.org.springframework.mail=INFO
logging.level.root=INFO

# ==============================================================================
# 11. ACTUATOR (exponer solo lo necesario; proteger en el edge)
# ==============================================================================
management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.show-details=when_authorized
