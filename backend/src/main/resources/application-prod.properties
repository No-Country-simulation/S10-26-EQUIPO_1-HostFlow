# ==============================================================================
# HostFlow - Configuración del Entorno de PRODUCCIÓN
# ==============================================================================
# Este archivo contiene las configuraciones estrictas y optimizadas para el
# entorno de producción. Prioriza la seguridad, el rendimiento y la estabilidad.
#
# ⚠️ REGLA DE ORO: El esquema de la base de datos NUNCA se modifica
# automáticamente aquí (ddl-auto=validate). Todos los cambios de estructura
# deben probarse primero en desarrollo y aplicarse en producción mediante
# scripts de migración controlados por Flyway.
# ==============================================================================

# ==============================================================================
# 1. CONFIGURACIÓN DE BASE DE DATOS (PostgreSQL Producción)
# ==============================================================================
# Las credenciales y la URL NUNCA deben estar hardcodeadas en el repositorio.
# Se utilizan variables de entorno del sistema operativo o del orquestador
# (Docker, Kubernetes, AWS Elastic Beanstalk, etc.).
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/hostflow_prod}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.username=${DB_USERNAME:hostflow_user}
spring.datasource.password=${DB_PASSWORD:change_me_in_production}

# ==============================================================================
# 2. OPTIMIZACIÓN DEL POOL DE CONEXIONES (HikariCP)
# ==============================================================================
# Ajustes de rendimiento para manejar alta concurrencia en producción.
# HikariCP es el pool de conexiones por defecto en Spring Boot y el más rápido.

# Número máximo de conexiones simultáneas en el pool.
# Regla general: ((núcleos_de_CPU * 2) + discos_efectivos). Para la mayoría de apps web, 10-20 es óptimo.
spring.datasource.hikari.maximum-pool-size=20

# Tiempo máximo (en ms) que un cliente esperará por una conexión del pool antes de recibir una excepción.
spring.datasource.hikari.connection-timeout=30000

# Tiempo máximo (en ms) que una conexión puede permanecer inactiva en el pool antes de ser retirada.
spring.datasource.hikari.idle-timeout=600000

# Vida máxima (en ms) de una conexión en el pool. Debe ser menor que el timeout del servidor de BD.
spring.datasource.hikari.max-lifetime=1800000

# ==============================================================================
# 3. CONFIGURACIÓN JPA / HIBERNATE (Modo Estricto)
# ==============================================================================
# 'validate': Hibernate solo verifica que las tablas y columnas existan y
# coincidan con las entidades @Entity. Si falta algo, la aplicación fallará
# al iniciar, evitando corrupción de datos por esquemas desactualizados.
spring.jpa.hibernate.ddl-auto=validate

# Especifica el dialecto de PostgreSQL para garantizar que Hibernate genere
# SQL optimizado y compatible con las características nativas de esta BD.
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# Deshabilita completamente la impresión de SQL en producción para ahorrar
# recursos de CPU, I/O de disco y evitar la exposición de lógica de negocio en los logs.
spring.jpa.show-sql=false

# Deshabilita "Open Session in View". Es crucial en producción para evitar
# que las transacciones de BD se mantengan abiertas durante la serialización
# JSON, lo que causa fugas de memoria y agotamiento del pool de conexiones.
spring.jpa.open-in-view=false

# ==============================================================================
# 4. CONFIGURACIÓN DE FLYWAY (Migraciones de Base de Datos)
# ==============================================================================
# En producción, Flyway es el ÚNICO encargado de modificar el esquema de la BD.
# Garantiza que los cambios sean atómicos, versionados y reproducibles.
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

# Si la base de datos ya existe y tiene tablas creadas manualmente, esta opción
# permite a Flyway crear su tabla de historial (flyway_schema_history) asumiendo
# que el estado actual es la "línea base" (versión 1).
spring.flyway.baseline-on-migrate=true

# ==============================================================================
# 5. CONFIGURACIÓN DE CORREO ELECTRÓNICO (Producción Real)
# ==============================================================================
# Configuración para un proveedor SMTP real y confiable (ej. AWS SES, SendGrid,
# Mailgun o Gmail con App Password). NUNCA usar Mailtrap en producción.
spring.mail.host=${MAIL_HOST:smtp.gmail.com}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:tu_email_real@dominio.com}
spring.mail.password=${MAIL_PASSWORD:tu_contraseña_de_aplicacion_real}

# Configuración de seguridad robusta para la conexión SMTP
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000

# ==============================================================================
# 6. CONFIGURACIÓN DE LOGGING (Rendimiento y Seguridad)
# ==============================================================================
# En producción, los logs deben ser informativos pero no verbosos, para evitar
# llenar el disco y exponer datos sensibles o trazas de stack innecesarias.
logging.level.com.hostflow=INFO
logging.level.org.springframework.web=INFO
logging.level.org.springframework.security=WARN
logging.level.org.hibernate=WARN

# ==============================================================================
# 7. CONFIGURACIÓN DE DOCUMENTACIÓN API (SWAGGER / OPENAPI)
# ==============================================================================
# DESACTIVADO POR SEGURIDAD.
# Exponer la documentación de la API en producción puede revelar endpoints
# internos, estructuras de datos y facilitar ataques de reconocimiento.
springdoc.api-docs.enabled=false
springdoc.swagger-ui.enabled=false

# ==============================================================================
# 8. CONFIGURACIÓN DEL SERVIDOR (Reverse Proxy)
# ==============================================================================
# Indica a Spring Boot que confíe en las cabeceras 'X-Forwarded-*' enviadas
# por un proxy inverso (como Nginx, Apache o un Load Balancer de AWS/GCP).
# Esto es crucial para que la aplicación conozca su URL real, el esquema (HTTPS)
# y la IP real del cliente, en lugar de la IP del proxy.
server.forward-headers-strategy=native