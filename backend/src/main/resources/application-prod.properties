# ==============================================================================
# HostFlow - Configuración Base de la Aplicación (Global)
# ==============================================================================
# Este archivo contiene la configuración común y por defecto que se aplica a
# TODOS los entornos (desarrollo, pruebas, producción).
#
# PRINCIPIO DE DISEÑO: Las configuraciones específicas de infraestructura
# (base de datos, JPA/Hibernate, Flyway, correo electrónico) deben residir
# preferiblemente en sus respectivos archivos de perfil (application-dev.properties,
# application-prod.properties). Este archivo actúa como fallback seguro.
#
# @author HostFlow Team
# @version 3.0.0 (Limpieza, unificación y eliminación de duplicados)
# ==============================================================================

# ==============================================================================
# 0. PERFIL ACTIVO (Opcional para desarrollo local)
# ==============================================================================
# Descomenta la siguiente línea para activar automáticamente el perfil 'dev'
# al iniciar la aplicación localmente. En producción, usa SPRING_PROFILES_ACTIVE=prod.
# spring.profiles.active=dev

# ==============================================================================
# 1. INFORMACIÓN GENERAL DE LA APLICACIÓN
# ==============================================================================
spring.application.name=HostFlow Backend

# Carga las variables locales desde .env (archivo no versionado en Git).
# Si el archivo no existe, la aplicación arranca igualmente gracias a "optional".
spring.config.import=optional:file:.env[.properties],optional:file:backend/.env[.properties]

# ==============================================================================
# 2. CONFIGURACIÓN DEL SERVIDOR WEB (Tomcat Embebido)
# ==============================================================================
server.port=8080
server.servlet.context-path=/api/v1

# ==============================================================================
# 3. CONFIGURACIÓN DE BASE DE DATOS (Fallback para Desarrollo Local)
# ==============================================================================
# ⚠️ En producción, estas variables DEBEN ser sobrescritas por application-prod.properties
# o variables de entorno del sistema operativo (sin valores por defecto).
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/hostflow_dev}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}

# ==============================================================================
# 4. CONFIGURACIÓN JPA / HIBERNATE (ORM)
# ==============================================================================
# 'update' es el fallback para desarrollo ágil.
# ⚠️ En producción (application-prod.properties) esto DEBE ser 'validate'.
spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

# ==============================================================================
# 5. CONFIGURACIÓN DE FLYWAY (Migraciones de Base de Datos)
# ==============================================================================
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=5

# ==============================================================================
# 6. CONFIGURACIÓN DE SEGURIDAD Y JWT (JSON Web Token)
# ==============================================================================
# ⚠️ CRÍTICO: En producción, sobrescribir con una variable de entorno (JWT_SECRET)
# de al menos 64 caracteres para el algoritmo HS512.
jwt.secret=${JWT_SECRET:HostFlowSecretKey2026VeryLongSecretKeyForHS512AlgorithmFallbackOnly}
jwt.expiration=86400000
jwt.refresh-expiration=604800000
jwt.issuer=HostFlow

# ==============================================================================
# 7. CONFIGURACIÓN DE SERIALIZACIÓN JSON (Jackson)
# ==============================================================================
# Mantiene el formato de fecha estándar ISO-8601 legible en lugar de timestamps numéricos.
spring.jackson.serialization.write-dates-as-timestamps=false
# Excluye del JSON de respuesta cualquier campo que tenga valor nulo (null).
spring.jackson.default-property-inclusion=non_null

# ==============================================================================
# 8. CONFIGURACIÓN DE DOCUMENTACIÓN API (Swagger / OpenAPI 3)
# ==============================================================================
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
# Ordena alfabéticamente las etiquetas y operaciones para mejorar la experiencia de usuario.
springdoc.swagger-ui.tags-sorter=alpha
springdoc.swagger-ui.operations-sorter=alpha

# ==============================================================================
# 9. CONFIGURACIÓN DE CORREO ELECTRÓNICO (SMTP Híbrido / Brevo)
# ==============================================================================
# API Key para servicios de correo transaccional modernos (ej. Brevo/Resend).
# Si está presente y es válida, el EmailService la priorizará sobre SMTP.
brevo.api.key=${BREVO_API_KEY:}

# Configuración SMTP de respaldo (Gmail, AWS SES, SendGrid, etc.)
spring.mail.host=${MAIL_HOST:smtp.gmail.com}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:tu_correo@gmail.com}
spring.mail.password=${MAIL_PASSWORD:tu_app_password_de_16_caracteres}

spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000

# ==============================================================================
# 10. CONFIGURACIÓN DE CLOUDINARY (Carga de Imágenes en la Nube)
# ==============================================================================
cloudinary.cloud-name=${CLOUDINARY_CLOUD_NAME:tu_cloud_name}
cloudinary.api-key=${CLOUDINARY_API_KEY:tu_api_key}
cloudinary.api-secret=${CLOUDINARY_API_SECRET:tu_api_secret}
cloudinary.folder=${CLOUDINARY_FOLDER:hostflow}

# Límites HTTP para la carga de archivos (Multipart)
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=10MB

# ==============================================================================
# 11. REGLAS DE NEGOCIO ESPECÍFICAS DE HOSTFLOW
# ==============================================================================
# Recuperación de contraseña
app.password-reset.expiration-minutes=60
app.password-reset.code-length=6

# Verificación de correo electrónico
app.email-verification.expiration-minutes=60
app.email-verification.frontend-url=http://localhost:3000/verify-email
app.email-verification.backend-url=http://localhost:8080/api/v1/auth/verify-email

# Tiempos de inactividad por rol (en milisegundos)
app.inactivity.owner-milliseconds=600000
app.inactivity.admin-milliseconds=900000
app.inactivity.warning-before-milliseconds=60000

# Bloqueo de cuenta por fuerza bruta
app.security.max-failed-attempts=5
app.security.block-duration-minutes=60
app.security.failed-attempts-window-minutes=60

# Reservas
app.reservations.link-expiration-hours=24
app.reservations.frontend-confirm-url=http://localhost:3000/reservations/confirm
app.reservations.tax-percentage=10

# ==============================================================================
# 12. CONFIGURACIÓN MULTIMONEDA Y CONVERSIÓN AUTOMÁTICA
# ==============================================================================
app.accommodation.default-currency=ARS
app.exchange-rate.dolarapi.url=https://dolarapi.com/v1/dolares
app.exchange-rate.eras-api.url=https://open.er-api.com/v6/latest/ARS
app.exchange-rate.max-age-hours=4

# ==============================================================================
# 13. CONFIGURACIÓN DE RENDIMIENTO Y POOL DE CONEXIONES (HikariCP)
# ==============================================================================
# Estos valores son un punto de partida. En producción, ajustar según la carga.
# spring.datasource.hikari.maximum-pool-size=20
# spring.datasource.hikari.minimum-idle=5
# spring.datasource.hikari.connection-timeout=30000
# spring.datasource.hikari.idle-timeout=600000
# spring.datasource.hikari.max-lifetime=1800000

# ==============================================================================
# 14. CONFIGURACIÓN DE ACTUATORS (Monitoreo y Health Checks)
# ==============================================================================
# management.endpoints.web.exposure.include=health,info,metrics
# management.endpoint.health.show-details=when_authorized