# ==============================================================================
# HostFlow - Configuración del Entorno de PRUEBAS (Test)
# ==============================================================================
# Este archivo sobrescribe las propiedades base exclusivamente cuando la
# aplicación se ejecuta con el perfil activo 'test' (@ActiveProfiles("test")).
#
# Objetivo: Proporcionar un entorno ligero, rápido y aislado para las pruebas
# unitarias y de integración, utilizando H2 en memoria y deshabilitando
# servicios externos innecesarios para evitar fallos de red o contexto.
# ==============================================================================

# ==============================================================================
# 1. CONFIGURACIÓN DE SEGURIDAD Y JWT
# ==============================================================================
# Clave secreta válida para HS512 (mínimo 64 caracteres).
# Se extiende la clave original para evitar errores de inicialización en JwtService.
jwt.secret=HostFlowTestSecretKeyForJwtSigning123456789012345678901234567890123456
app.admin.password=test-admin-password

# ==============================================================================
# 2. CONFIGURACIÓN DE BASE DE DATOS (H2 en Memoria)
# ==============================================================================
# Base de datos H2 en modo PostgreSQL para máxima compatibilidad con las
# consultas nativas y migraciones, pero ejecutándose completamente en memoria.
# DB_CLOSE_DELAY=-1 mantiene la BD viva mientras la JVM esté activa.
spring.datasource.url=jdbc:h2:mem:hostflow_test;MODE=PostgreSQL;DB_CLOSE_DELAY=-1;DATABASE_TO_LOWER=TRUE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# ==============================================================================
# 3. CONFIGURACIÓN JPA / HIBERNATE
# ==============================================================================
# 'create-drop': Hibernate crea el esquema al iniciar las pruebas y lo elimina
# al finalizar, garantizando un estado limpio y aislado para cada clase de prueba.
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.H2Dialect
# Desactivamos show-sql en tests para mantener los logs limpios y enfocados en fallos.
spring.jpa.show-sql=false
spring.jpa.open-in-view=false

# ==============================================================================
# 4. CONFIGURACIÓN DE FLYWAY
# ==============================================================================
# Deshabilitado en pruebas. Dejamos que Hibernate (ddl-auto=create-drop)
# gestione el esquema para evitar conflictos de orden de ejecución con Flyway
# y acelerar drásticamente el inicio del contexto de prueba.
spring.flyway.enabled=false

# ==============================================================================
# 5. CONFIGURACIÓN DE SERVICIOS EXTERNOS (Mock / Dummy)
# ==============================================================================
# Clave dummy de Brevo. Al NO iniciar con "xkeysib-", el EmailService ignorará
# la ruta de la API de Brevo y fallback a JavaMailSender (que en pruebas suele
# estar mockeado con @MockBean, evitando llamadas de red reales).
brevo.api.key=test-dummy-brevo-key

# Propiedades de Cloudinary obligatorias por la anotación @Validated en
# CloudinaryProperties (@NotBlank). Se usan valores dummy seguros, ya que
# el servicio CloudinaryImageService es mockeado (@MockBean) en las pruebas
# de integración, por lo que nunca se realizará una conexión real.
cloudinary.cloud-name=test_cloud_name
cloudinary.api-key=test_api_key
cloudinary.api-secret=test_api_secret
cloudinary.folder=hostflow_test

# ==============================================================================
# 6. CONFIGURACIÓN DE CORREO ELECTRÓNICO (SMTP Dummy)
# ==============================================================================
# Valores dummy para evitar que el auto-configurador de JavaMailSender falle
# al intentar crear el bean si no se proporcionan propiedades básicas.
# En las pruebas reales, este bean suele ser reemplazado por un @MockBean.
spring.mail.host=smtp.test.local
spring.mail.port=587
spring.mail.username=test@test.local
spring.mail.password=test_password
spring.mail.properties.mail.smtp.auth=false
spring.mail.properties.mail.smtp.starttls.enable=false