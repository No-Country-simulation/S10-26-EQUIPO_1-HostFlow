# Valores de prueba para iniciar el contexto
jwt.secret=HostFlowTestSecretKeyForJwtSigning1234567890
app.admin.password=test-admin-password

# Base de datos en memoria, solo para pruebas
spring.datasource.url=jdbc:h2:mem:hostflow_test;MODE=PostgreSQL;DB_CLOSE_DELAY=-1;DATABASE_TO_LOWER=TRUE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# Hibernate administra el esquema durante las pruebas
spring.jpa.hibernate.ddl-auto=create-drop

# No ejecutar Flyway
spring.flyway.enabled=false